\* The chart config: the writer's room alone, with the four instants the room's
\* story turns on (first key, warn, wipe line, 0:00). It keeps all 17 rules, so
\* a mark in the chart would be a real violation. It is a presentation size, not
\* a weaker check; the three timing configs are the check.
SPECIFICATION Spec
CONSTANTS
 Surfaces = {"Root"}
 Duration = 60
 Silence = 8
 RootRule = "deadline"
 Times = {0, 4, 5, 7, 8, 11, 18, 25, 32, 39, 46, 53, 60, 61}
INVARIANTS
 NoLateRescue
 DeadlineBeforeInput
 EarlierDeadlineWins
 TieAndSilenceDelete
