\* The chart config: the writer's room alone, with the instants its story turns
\* on (first key, warn, wipe line, the 0:00 keep, the key after 0:00) and the live
\* keys that reach them. It keeps all 18 rules, so a mark in the chart would be a
\* real violation. It is a presentation size, not a weaker check; the three timing
\* configs are the check.
SPECIFICATION Spec
CONSTANTS
 Surfaces = {"Root"}
 Duration = 60
 Silence = 8
 RootRule = "deadline"
 Times = {0, 4, 5, 7, 8, 11, 18, 25, 32, 39, 46, 53, 58, 60}
INVARIANTS
 NoLateRescue
 DeadlineBeforeInput
 EarlierDeadlineWins
 TieAndSilenceDelete
 DeadlineReceipt
 OnlyAuthorizedEntry
 TrialBound
 FirstInputCharges
 LicenseIndependentOfTrial
 NoticeOnce
 WarningOwnsNote
 ExitClearsText
 InputCancelsExit
 NoEmptyKept
 TwoActExit
 ClockWaitsForFirst
 DeletionNeverErasesCommitted
 FreshClockStartsAtKey
